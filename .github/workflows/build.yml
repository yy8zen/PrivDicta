name: build

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  # Windows のコンソールは cp1252 のため、日本語を print すると落ちる
  PYTHONUTF8: "1"

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Qt と PortAudio の実行に要るライブラリを入れる
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libegl1 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 libxcb-randr0 \
            libxcb-render-util0 libxcb-image0 libportaudio2
      - run: pip install -e ".[dev]"
      - name: テストを実行する
        run: xvfb-run -a python -m pytest -q

  package:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          # Intel Mac 版は作らない。moonshine-voice の macOS x86_64 向けパッケージは 0.0.59 で止まっている
          - os: macos-latest
            name: macos-arm64
          - os: ubuntu-22.04
            name: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: バージョンを決める
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=0.1.0-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          fi
      - name: Linux のビルドに要るライブラリを入れる
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 libxcb-randr0 libxcb-render-util0 \
            libxcb-image0 libportaudio2
      - run: pip install -e ".[dev]"
      - name: 同梱する日本語モデルをダウンロードする
        run: |
          python scripts/fetch_model.py base
      - name: PyInstaller で固める
        run: pyinstaller --noconfirm packaging/privdicta.spec

      - name: サードパーティのライセンスを集めて同梱する
        shell: bash
        run: |
          python scripts/collect_licenses.py dist/PrivDicta/_internal build/third_party_licenses build/bundled-top-level.txt
          if [ -d dist/PrivDicta.app ]; then
            cp -R build/third_party_licenses dist/PrivDicta.app/Contents/Resources/
          else
            cp -R build/third_party_licenses dist/PrivDicta/
          fi
          cp build/third_party_licenses/THIRD-PARTY-NOTICES.md "dist/THIRD-PARTY-NOTICES-${{ matrix.name }}.md"

      - name: Windows のインストーラーを作る
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            choco install innosetup -y --no-progress
            $env:Path += ";C:\Program Files (x86)\Inno Setup 6"
          }
          iscc /DAppVersion=$env:VERSION packaging\windows\installer.iss

      - name: macOS の dmg を作る（アドホック署名）
        if: runner.os == 'macOS'
        run: |
          codesign --force --deep --sign - dist/PrivDicta.app
          # dmg にはアプリのほか、Applications へのリンクと使い方、ライセンスを入れる
          mkdir -p build/dmg
          cp -R dist/PrivDicta.app build/dmg/
          ln -s /Applications build/dmg/Applications
          cp docs/user-guide.md "build/dmg/使い方.md"
          cp packaging/NOTICE.txt packaging/MOONSHINE-LICENSE.txt build/dmg/
          cp -R build/third_party_licenses build/dmg/
          hdiutil create -volname PrivDicta -srcfolder build/dmg \
            -ov -format UDZO "dist/privdicta-${VERSION}-${{ matrix.name }}.dmg"

      - name: Linux の AppImage を作る
        if: runner.os == 'Linux'
        run: bash packaging/linux/build-appimage.sh "$VERSION"

      - name: 使い方とライセンスを配布物の横に置く
        shell: bash
        run: |
          cp docs/user-guide.md "dist/使い方.md"
          cp packaging/NOTICE.txt packaging/MOONSHINE-LICENSE.txt dist/

      - name: 配布物のサイズを表示する
        shell: bash
        run: ls -l dist/*.exe dist/*.dmg dist/*.AppImage 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: privdicta-${{ matrix.name }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.md
            dist/*.txt
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: actions/checkout@v4
        with:
          path: src
      - name: リリースノートの有無を確かめる
        id: notes
        run: |
          f="src/docs/release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$f" ]; then echo "path=$f" >> "$GITHUB_OUTPUT"; fi
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          body_path: ${{ steps.notes.outputs.path }}
          draft: true
